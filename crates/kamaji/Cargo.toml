[package]
name = "kamaji"
version.workspace = true
edition.workspace = true
license.workspace = true
# The end-user binary — not a crates.io package (consistent with kamajid /
# kamaji-core). Also lets cargo-deny's allow-wildcard-paths cover its internal
# path deps, which crates.io would otherwise disallow on a publishable crate.
publish = false

[dependencies]
kamaji-core = { path = "../kamaji-core" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
directories = "5"
anyhow = "1"
ureq = "2"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows release archives are `.zip` (Windows-idiomatic); extract them with a
# pure-Rust unzip rather than relying on a bundled CLI tool. Unix uses `tar`.
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
kamajid = { path = "../kamajid" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
