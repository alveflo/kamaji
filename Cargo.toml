[workspace]
resolver = "2"
members = [
    "crates/kamaji-core",
    "crates/kamaji",
    "crates/kamajid",
]

# Shared package metadata. Each crate inherits these with `version.workspace =
# true` / `edition.workspace = true` so the whole workspace versions in lockstep.
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
