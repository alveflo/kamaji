name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          # Ship BOTH binaries: the TUI (`kamaji`) spawns the daemon (`kamajid`)
          # as a sibling, so an archive with only `kamaji` is a broken install.
          dir="target/${{ matrix.target }}/release"
          asset="kamaji-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "$dir" kamaji kamajid
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ship BOTH binaries (see the Unix step): kamaji.exe spawns kamajid.exe.
          $dir = "target/${{ matrix.target }}/release"
          $asset = "kamaji-${{ matrix.target }}.zip"
          $bins = @("$dir/kamaji.exe", "$dir/kamajid.exe")
          Compress-Archive -Path $bins -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Glob both archive flavours; non-matching patterns are skipped
          # (fail_on_unmatched_files defaults to false), so each runner uploads
          # only the asset it actually produced.
          files: |
            kamaji-${{ matrix.target }}.tar.gz
            kamaji-${{ matrix.target }}.tar.gz.sha256
            kamaji-${{ matrix.target }}.zip
            kamaji-${{ matrix.target }}.zip.sha256
